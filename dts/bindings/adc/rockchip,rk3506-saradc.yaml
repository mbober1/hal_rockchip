title: Rockchip RK3506 Successive Approximation Register (SAR) A/D Converter

description: |
  Rockchip RK3506 Successive Approximation Register

compatible: "rockchip,rk3506-saradc"

include: adc-controller.yaml

properties:
  reg:
    required: true

  vref-mv:
    type: int
    default: 1800
    description: Reference voltage in mV (SARADC_AVDD1V8).

  "#io-channel-cells":
    const: 1

io-channel-cells:
  - input
