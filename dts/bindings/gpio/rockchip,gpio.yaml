title: Rockchip GPIO

description: |
  Rockchip GPIO controller

compatible: "rockchip,gpio"

include: [gpio-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  bank-id:
    type: int
    required: true
    description: HAL bank index (eGPIO_bankId), e.g. 1 for GPIO1.

gpio-cells:
  - pin
  - flags
