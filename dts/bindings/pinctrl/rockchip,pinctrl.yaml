title: Rockchip pin controller

description: |
  Pin function selection through the per-bank IOMUX or the RMIO matrix.
  Pin values are built with RK_PINMUX() or RK_RMIO() from
  <zephyr/dt-bindings/pinctrl/rockchip-pinctrl.h>, for example:

    &pinctrl {
      uart4_default: uart4_default {
        group0 {
          pinmux = <RK_RMIO(1, RK_PC2, RK_RMIO_UART4_TX)>;
        };
        group1 {
          pinmux = <RK_RMIO(1, RK_PC3, RK_RMIO_UART4_RX)>;
          bias-pull-up;
        };
      };
    };

  Properties that are not given leave the hardware setting unchanged.

compatible: "rockchip,pinctrl"

include: base.yaml

child-binding:
  description: Pin controller state.
  child-binding:
    description: Group of pins sharing the same configuration.

    include:
      - name: pincfg-node.yaml
        property-allowlist:
          - bias-disable
          - bias-pull-up
          - bias-pull-down
          - input-schmitt-enable
          - drive-strength

    properties:
      pinmux:
        required: true
        type: array
        description: Pins built with RK_PINMUX() or RK_RMIO().
      drive-strength:
        enum: [0, 1, 2, 3, 4, 5]
        description: Drive strength level (HAL PIN_CONFIG_DRV_LEVELn).
