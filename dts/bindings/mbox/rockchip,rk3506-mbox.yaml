title: Rockchip RK3506 Mailbox

maintainers:
  - Marcin Bober <mbober1@gmail.com>

description: |
  One group per 4 KB instance. The Cortex-M0 is
  the BB side: it receives on A2B and sends on B2A.
  Only one instance can be routed to M0 IRQ 22.

compatible: "rockchip,rk3506-mbox"

include: [base.yaml, mailbox-controller.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

mbox-cells:
  - channel
