title: Rockchip INTMUX

description: |
  Routes 128 peripheral IRQs to the M0 NVIC as
  four groups of 32; group n drives NVIC line 28 + n. Each group is a child
  node with compatible "rockchip,intmux-ch".

compatible: "rockchip,intmux"

include: base.yaml

properties:
  reg:
    required: true
