title: Rockchip RK3506 INTMUX

maintainers:
  - Marcin Bober <mbober1@gmail.com>

description: |
  Routes 128 peripheral IRQs to the M0 NVIC as
  four groups of 32; group n drives NVIC line 28 + n. Each group is a child
  node with compatible "rockchip,rk3506-intmux-ch".

compatible: "rockchip,rk3506-intmux"

include: base.yaml

properties:
  reg:
    required: true
