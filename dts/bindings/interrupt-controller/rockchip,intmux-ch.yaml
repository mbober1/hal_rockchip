title: Rockchip INTMUX Channel

description: |
  One Rockchip INTMUX group of 32 inputs. The interrupt specifier is the
  line within the group (INTMUX source ID modulo 32).

compatible: "rockchip,intmux-ch"

include: [interrupt-controller.yaml, base.yaml]

properties:
  reg:
    required: true

  interrupts:
    required: true

interrupt-cells:
  - irq
